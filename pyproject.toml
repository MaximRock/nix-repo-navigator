[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-navigator"
version = "0.1.0"
description = "Knowledge-graph assistant for NixOS and home-manager repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "watchdog>=4.0",
    "xxhash>=3.4",
    "GitPython>=3.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
plugins = [
    "tree-sitter>=0.21",
    "tree-sitter-languages>=1.10",
    "kdl-py>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
repo-navigator = "repo_navigator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_navigator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
